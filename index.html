<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inky Vibes Tattoo</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

<style>
html,body{
  height:100%;
  margin:0;
  background:#000;
  font-family:'Montserrat',Arial,Helvetica,sans-serif;
}

/* ===== HERO ===== */
.hero{
  position:relative;
  height:100svh;
  width:100%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* video */
video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}

/* dark overlay */
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:1;
}

/* center content */
.center{
  position:relative;
  z-index:2;
  opacity:0;
  animation:fadeIn 1.2s ease forwards;
  padding:0 16px;
}

/* title */
.title{
  color:rgba(255, 255, 255, 0.45); 
  font-weight:800;
  font-size:clamp(28px,6vw,64px);
  letter-spacing:.22em;
  margin-bottom:28px;
  text-shadow:
    0 0 12px rgba(255,255,255,.25), 
    0 0 35px rgba(255,255,255,.15); 
}

/* ===== BUTTON ===== */
.btn{
  display:inline-block;
  padding:10px 16px; 
  border:2px solid white;
  color:white;
  text-decoration:none;
  letter-spacing:.22em;
  font-size:11px;
  border-radius:10px;
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(6px);
  transition:.3s;
  cursor:pointer;
  
  /* soft pulse */
  animation:pulse 2.8s ease-in-out infinite;
}

.btn:hover{
  background:white;
  color:black;
  box-shadow:0 0 18px rgba(255,255,255,.6);
  animation:none; 
}

/* pulse animation */
@keyframes pulse{
  0%{
    box-shadow:0 0 0 0 rgba(255,255,255,.35);
  }
  50%{
    box-shadow:0 0 18px 6px rgba(255,255,255,.18);
  }
  100%{
    box-shadow:0 0 0 0 rgba(255,255,255,.35);
  }
}

/* fade in */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="hero">

  <!-- VİDEO KISMINA "loop" EKLENDİ -->
  <video id="v"
    autoplay muted playsinline loop
    preload="auto"
    disablepictureinpicture
    poster="poster.jpg">
    <source src="video.mp4" type="video/mp4">
  </video>

  <div class="center">
    <div class="title">INKY VIBES TATTOO</div>

    <!-- Booking Button with Session Handler -->
    <a class="btn" id="booking-btn" href="https://ajanvaraus.inkyvibestattoo.com/" onclick="handleBookingClick(event)">
      VARAA AIKA NYT
    </a>
  </div>

</div>

<script>
const v = document.getElementById("v");

let iframeUser = null;

function tryPlay(){
  const p = v.play();
  if (p && typeof p.catch === "function") p.catch(()=>{});
}

window.addEventListener("load", () => {
    tryPlay();
    // Ask parent page for login state on load
    if (window.parent !== window) {
        window.parent.postMessage({ action: "checkLoginState" }, "*");
    }
});

document.addEventListener("touchstart", tryPlay, { once:true });
document.addEventListener("click", tryPlay, { once:true });

// Listen for login state updates from the main page
window.addEventListener("message", function(event) {
    const data = event.data;
    if (data && data.action === "updateLoginState") {
        iframeUser = data.user;
    }
});

// Handle click on "VARAA AIKA NYT" to pass session parameter if logged in
function handleBookingClick(e) {
    e.preventDefault();
    let targetUrl = "https://ajanvaraus.inkyvibestattoo.com/";

    if (iframeUser) {
        const encodedUser = encodeURIComponent(JSON.stringify(iframeUser));
        targetUrl += "?session=" + encodedUser;
    }

    // Break out of iframe and load in main window top tab
    window.top.location.href = targetUrl;
}
</script>

</body>
</html>
